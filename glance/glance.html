<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tabes Glance</title>
  <link rel="stylesheet" href="glance.css">
</head>
<body>
  <div id="glance-header">
    <img id="glance-icon" alt="">
    <div id="glance-title"></div>
    <button id="btn-open-tab" title="Open in new tab">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <path d="M9 2h5v5M14 2L7 9M6 3H3a1 1 0 00-1 1v9a1 1 0 001 1h9a1 1 0 001-1v-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="btn-close" title="Close (Esc)">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <iframe id="glance-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-storage-access-by-user-activation"></iframe>

  <script src="../common/theme.js"></script>
  <script src="glance.js"></script>
</body>
</html>
