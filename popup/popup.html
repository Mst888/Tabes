<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabes</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1>Tabes</h1>
      <button id="btn-settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M6.5 1.5h3l.5 2 1.5.7 1.8-1 2.1 2.1-1 1.8.7 1.5 2 .5v3l-2 .5-0.7 1.5 1 1.8-2.1 2.1-1.8-1-1.5.7-.5 2h-3l-.5-2-1.5-.7-1.8 1-2.1-2.1 1-1.8-.7-1.5-2-.5v-3l2-.5.7-1.5-1-1.8 2.1-2.1 1.8 1 1.5-.7z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
          <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.2"/>
        </svg>
      </button>
    </header>

    <div class="popup-content">
      <div class="quick-add">
        <p>Add current page as panel:</p>
        <button id="btn-add-current" class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Add Current Page
        </button>
      </div>

      <div class="panel-list">
        <h3>Your Panels</h3>
        <div id="panels-list"></div>
      </div>

      <div class="popup-actions">
        <button id="btn-open-sidebar" class="btn-secondary">Open Sidebar</button>
        <button id="btn-float" class="btn-secondary">Floating Bar: Off</button>
      </div>
    </div>
  </div>

  <script src="../common/theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
